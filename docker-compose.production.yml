version: "3.8"

services:
  # PostgreSQL 15 Database
  postgres:
    image: postgres:15-alpine
    container_name: intelx-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=intelx
      - POSTGRES_PASSWORD
      - POSTGRES_DB=intelx
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelx -d intelx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intelx-network

  # Redis 7 for Queue Orchestration & Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: intelx-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - intelx-network

  # IntelX API Replica 1
  intelx-api-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelx-api-1
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - INTELX_ENV=production
      - INTELX_MOCK_MODE=false
      - INTELX_DB_URL=${INTELX_DB_URL:?Set INTELX_DB_URL in the deployment environment}
      - INTELX_REDIS_URL=redis://redis:6379/0
      - INTELX_DATA_DIR=/app/data
      - INTELX_MAX_CONCURRENT_RUNS=5
      - INTELX_RETENTION_DAYS_RAW_DOCS=30
      - INTELX_RETENTION_DAYS_REPORTS=365
      - INTELX_SECRET_KEY=${INTELX_SECRET_KEY:?Set INTELX_SECRET_KEY in the deployment environment}
      - INTELX_API_KEY=${INTELX_API_KEY:?Set INTELX_API_KEY in the deployment environment}
      - INTELX_API_KEYS=${INTELX_API_KEYS:-}
      - INTELX_LLM_PROVIDER=inference
      - INTELX_INFERENCE_URL=${INTELX_INFERENCE_URL:-https://inference-h7bn.onrender.com}
      - INTELX_LLM_MODEL=${INTELX_LLM_MODEL:?Set a non-mock INTELX_LLM_MODEL}
      - INTELX_INFERENCE_API_KEY=${INTELX_INFERENCE_API_KEY:?Set INTELX_INFERENCE_API_KEY}
    volumes:
      - shared_data:/app/data
    networks:
      - intelx-network

  # IntelX API Replica 2
  intelx-api-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelx-api-2
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - INTELX_ENV=production
      - INTELX_MOCK_MODE=false
      - INTELX_DB_URL=${INTELX_DB_URL:?Set INTELX_DB_URL in the deployment environment}
      - INTELX_REDIS_URL=redis://redis:6379/0
      - INTELX_DATA_DIR=/app/data
      - INTELX_MAX_CONCURRENT_RUNS=5
      - INTELX_RETENTION_DAYS_RAW_DOCS=30
      - INTELX_RETENTION_DAYS_REPORTS=365
      - INTELX_SECRET_KEY=${INTELX_SECRET_KEY:?Set INTELX_SECRET_KEY in the deployment environment}
      - INTELX_API_KEY=${INTELX_API_KEY:?Set INTELX_API_KEY in the deployment environment}
      - INTELX_API_KEYS=${INTELX_API_KEYS:-}
      - INTELX_LLM_PROVIDER=inference
      - INTELX_INFERENCE_URL=${INTELX_INFERENCE_URL:-https://inference-h7bn.onrender.com}
      - INTELX_LLM_MODEL=${INTELX_LLM_MODEL:?Set a non-mock INTELX_LLM_MODEL}
      - INTELX_INFERENCE_API_KEY=${INTELX_INFERENCE_API_KEY:?Set INTELX_INFERENCE_API_KEY}
    volumes:
      - shared_data:/app/data
    networks:
      - intelx-network

  # IntelX Background Orchestration Worker
  intelx-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: intelx-worker
    restart: unless-stopped
    entrypoint: ["tini", "--", "python", "-m", "intelx.cli.main"]
    command: ["worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - INTELX_ENV=production
      - INTELX_MOCK_MODE=false
      - INTELX_DB_URL=${INTELX_DB_URL:?Set INTELX_DB_URL in the deployment environment}
      - INTELX_REDIS_URL=redis://redis:6379/0
      - INTELX_DATA_DIR=/app/data
      - INTELX_MAX_CONCURRENT_RUNS=5
      - INTELX_SECRET_KEY=${INTELX_SECRET_KEY:?Set INTELX_SECRET_KEY in the deployment environment}
      - INTELX_API_KEY=${INTELX_API_KEY:?Set INTELX_API_KEY in the deployment environment}
      - INTELX_API_KEYS=${INTELX_API_KEYS:-}
      - INTELX_LLM_PROVIDER=inference
      - INTELX_INFERENCE_URL=${INTELX_INFERENCE_URL:-https://inference-h7bn.onrender.com}
      - INTELX_LLM_MODEL=${INTELX_LLM_MODEL:?Set a non-mock INTELX_LLM_MODEL}
      - INTELX_INFERENCE_API_KEY=${INTELX_INFERENCE_API_KEY:?Set INTELX_INFERENCE_API_KEY}
    volumes:
      - shared_data:/app/data
    networks:
      - intelx-network

  # Nginx Reverse Proxy with TLS & SSE Configuration
  nginx:
    image: nginx:alpine
    container_name: intelx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - intelx-api-1
      - intelx-api-2
    networks:
      - intelx-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  shared_data:
    driver: local

networks:
  intelx-network:
    driver: bridge
