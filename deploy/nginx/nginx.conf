events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    upstream intelx_api_pool {
        least_conn;
        server intelx-api-1:8000 max_fails=3 fail_timeout=10s;
        server intelx-api-2:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Client body size limit
        client_max_body_size 30M;

        # Standard API & Web Proxy
        location / {
            proxy_pass http://intelx_api_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;
        }

        # Real-time Server-Sent Events (SSE) Streaming
        location ~ ^/(api/v1/events|api/v1/friday/research/.*/events) {
            proxy_pass http://intelx_api_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # Health & Prometheus Telemetry Probes
        location ~ ^/(healthz|readyz|metrics) {
            proxy_pass http://intelx_api_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            access_log off;
        }
    }
}
