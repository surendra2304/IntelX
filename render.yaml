services:
  - type: web
    name: intelx
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: HOST
        value: "0.0.0.0"
      - key: ENVIRONMENT
        value: "production"
      - key: INTELX_DATA_DIR
        value: "/app/data"
      - key: INTELX_DB_URL
        value: "sqlite+aiosqlite:////app/data/intelx.db"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: TURSO_DATABASE_URL
        value: "https://intelx-db-surendra2304.aws-ap-south-1.turso.io"
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: INTELX_API_KEY
        sync: false
      # Live Mesh Interconnects
      - key: FRIDAY_URL
        value: "https://friday-zw59.onrender.com"
      - key: FRIDAY_API_KEY
        sync: false
      - key: INFERENCE_URL
        value: "https://inference-r1sn.onrender.com"
      - key: INFERENCE_API_KEY
        sync: false
      - key: STRATEX_URL
        value: "https://stratex-8wj1.onrender.com"
      - key: STRATEX_API_KEY
        sync: false
      - key: MEMORA_URL
        value: "https://memora-cavc.onrender.com"
      - key: MEMORA_API_KEY
        sync: false
      - key: FUTURIS_URL
        value: "https://futuris-th6f.onrender.com"
      - key: FUTURIS_API_KEY
        sync: false
      - key: CORTEX_URL
        value: "https://cortex-0m7c.onrender.com"
      - key: CORTEX_API_KEY
        sync: false
      - key: FORGE_URL
        value: "https://forge-e9kl.onrender.com"
      - key: FORGE_API_KEY
        sync: false
      - key: SENTINEL_URL
        value: "https://sentinel-a861.onrender.com"
      - key: SENTINEL_API_KEY
        sync: false
