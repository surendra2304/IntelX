services:
  - type: web
    name: intelx
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: INTELX_ENV
        value: "production"
      - key: INTELX_MOCK_MODE
        value: "false"
      - key: INTELX_RUN_EMBEDDED_WORKER
        value: "true"
      - key: INTELX_DATA_DIR
        value: "/app/data"
      - key: INTELX_DB_URL
        fromDatabase:
          name: intelx-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: INTELX_SECRET_KEY
        generateValue: true
      - key: INTELX_API_KEY
        generateValue: true
      - key: INTELX_LLM_PROVIDER
        value: "inference"
      - key: INTELX_LLM_MODEL
        sync: false
      # Live Mesh Interconnects
      - key: FRIDAY_URL
        value: "https://friday-zw59.onrender.com"
      - key: FRIDAY_API_KEY
        sync: false
      - key: INFERENCE_URL
        value: "https://inference-h7bn.onrender.com"
      - key: INTELX_INFERENCE_API_KEY
        sync: false
      - key: STRATEX_URL
        value: "https://stratex-8wj1.onrender.com"
      - key: STRATEX_API_KEY
        sync: false
      - key: MEMORA_URL
        value: "https://memora-cavc.onrender.com"
      - key: MEMORA_API_KEY
        sync: false
      - key: FUTURIS_URL
        value: "https://futuris-th6f.onrender.com"
      - key: FUTURIS_API_KEY
        sync: false
      - key: CORTEX_URL
        value: "https://cortex-0m7c.onrender.com"
      - key: CORTEX_API_KEY
        sync: false
      - key: FORGE_URL
        value: "https://forge-e9kl.onrender.com"
      - key: FORGE_API_KEY
        sync: false
      - key: SENTINEL_URL
        value: "https://sentinel-a861.onrender.com"
      - key: SENTINEL_API_KEY
        sync: false

databases:
  - name: intelx-db
    databaseName: intelx
    user: intelx
    plan: free
    region: singapore
